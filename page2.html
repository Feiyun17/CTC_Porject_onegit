<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Type</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui.css">
</head>

<body>

    <header class="text-level-1" style="margin-bottom: 80px;">
        FROM HERE, YOU CAN ENTER FOUR TYPES OF THEATRES
    </header>

    <main class="options-container">
        <div class="ui-portfolio-box" data-link="stage_play.html">
            <span class="text-level-3">STAGE PLAY</span>
        </div>

        <div class="ui-portfolio-box" data-link="immersive.html">
            <span class="text-level-3">IMMERSIVE<br>THEATRE</span>
        </div>

        <div class="ui-portfolio-box" data-link="cinema.html">
            <span class="text-level-3">CINEMA</span>
        </div>

        <div class="ui-portfolio-box" data-link="busking.html">
            <span class="text-level-3">BUSKING</span>
        </div>
    </main>

    <div class="spacer-huge"></div>

    <section class="text-level-2" style="margin-bottom: 30px;">
        AND HERE’S MY THEATRE DESIGN—EXPLORE IT!
    </section>

    <div class="toggle-wrapper toggle-light" id="bottomToggle">
        <div class="toggle-slider"></div>
        <span class="toggle-text text-left">YES</span>
        <span class="toggle-text text-right">GO</span>
    </div>

    <script>
        document.querySelectorAll('.ui-portfolio-box').forEach(function (box) {
            box.addEventListener('click', function () {
                const target = this.getAttribute('data-link');
                this.classList.add('clicked');

                setTimeout(function () {
                    window.location.href = target;
                }, 300);
            });
        });

        document.getElementById('bottomToggle').addEventListener('click', function () {
            this.classList.add('active');

            setTimeout(function () {
                window.location.href = 'https://feiyun17.github.io/Blurring-boundaries_thertergit/';
            }, 500);
        });
    </script>

</body>
</html>
